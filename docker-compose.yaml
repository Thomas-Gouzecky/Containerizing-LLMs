services:
    open-webui:
        image: ghcr.io/open-webui/open-webui:main
        ports:
            - "3000:8080"
        environment:
            - OPENAI_API_BASE_URL=http://model-runner.docker.internal/engines/v1
            - WEBUI_AUTH=false
            - WEBUI_NAME=WebUI with Docker Model Runner
        volumes:
            - open-webui:/app/backend/data

volumes:
    open-webui:
